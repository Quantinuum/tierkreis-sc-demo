[project]
name = "tierkreis-sc-demo"
version = "0.1.0"
description = "Rust-orchestrated typed Tierkreis FMO2 orbital-optimized pUCCD application"
readme = "README.md"
authors = [
    { name = "Philipp Seitz", email = "philipp.seitz@quantinuum.com" },
    { name = "John Children", email = "john.children@quantinuum.com" }
]
requires-python = ">=3.12"
dependencies = [
    "tierkreis==3.0.0rc1",
    "tkr-fmo-pyscf-worker",
    "tkr-fmo-puccd-worker",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.17.4",
]
workers = [
    "tkr-fmo-pyscf-worker-impl",
    "tkr-fmo-puccd-worker-impl",
]

[tool.hatch.build.targets.wheel]
packages = ["tkr/graphs/fmo_vqe"]
exclude = ["tkr/workers/**"]

[tool.uv.workspace]
members = [
    "tkr/workers/fmo_pyscf_worker",
    "tkr/workers/fmo_puccd_worker",
    "tkr/workers/fmo_pyscf_worker/api",
    "tkr/workers/fmo_puccd_worker/api",
]

[tool.uv.sources]
tkr-fmo-pyscf-worker = { workspace = true }
tkr-fmo-puccd-worker = { workspace = true }
tkr-fmo-pyscf-worker-impl = { workspace = true }
tkr-fmo-puccd-worker-impl = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py313"
