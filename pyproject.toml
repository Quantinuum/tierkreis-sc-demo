[project]
name = "tierkreis-sc-demo"
version = "0.1.0"
description = "Rust-orchestrated typed Tierkreis FMO2 orbital-optimized pUCCD application"
readme = "README.md"
authors = [
    { name = "Philipp Seitz", email = "philipp.seitz@quantinuum.com" }
]
requires-python = ">=3.12"
dependencies = [
    "tierkreis==3.0.0rc0",
    "tkr-fmo-control-worker-impl",
    "tkr-fmo-chemistry-worker-impl",
    "tkr-fmo-quantum-worker-impl",
]

[dependency-groups]
dev = ["tierkreis[stubs]==3.0.0rc0", "pyright"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fmo_vqe", "tkr"]
exclude = ["tkr/workers/**"]

[tool.uv.workspace]
members = ["tkr/workers/fmo_*", "tkr/workers/fmo_*/api"]

[tool.uv.sources]
tkr-fmo-control-worker = { workspace = true }
tkr-fmo-chemistry-worker = { workspace = true }
tkr-fmo-quantum-worker = { workspace = true }
tkr-fmo-control-worker-impl = { workspace = true }
tkr-fmo-chemistry-worker-impl = { workspace = true }
tkr-fmo-quantum-worker-impl = { workspace = true }

[tool.ruff]
target-version = "py313"

[tool.ruff.lint.per-file-ignores]
"tkr/graphs/shared.py" = ["F821", "UP040"]
