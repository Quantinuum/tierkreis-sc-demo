[project]
name = "tkr-example-worker-impl"
version = "0.1.0"
description = "A tierkreis worker implementation."
readme = "README.md"
requires-python = ">=3.12"
authors = [ {name = "Your Name", email = "you@example.com"} ]
dependencies = [
    "tierkreis",
    "tkr-example-worker",
]

[tool.uv.workspace]
members = [
    "api",
]

[tool.uv.sources]
tkr-example-worker = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
tkr-example-worker = "tkr_example_worker_impl.main:main"

