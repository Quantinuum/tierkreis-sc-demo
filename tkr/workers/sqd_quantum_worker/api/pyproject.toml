[project]
name = "tkr-sqd-quantum-worker"
version = "0.1.0"
description = "A tierkreis worker api."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tierkreis==3.0.0rc1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"api.py" = "sqd_quantum_worker.py"
