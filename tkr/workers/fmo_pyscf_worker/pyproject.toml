[project]
name = "tkr-fmo-pyscf-worker-impl"
version = "0.1.0"
description = "A tierkreis worker implementation."
readme = "README.md"
requires-python = ">=3.12"
authors = [ {name = "Your Name", email = "you@example.com"} ]
dependencies = [
    "pyscf>=2.15.0",
    "tierkreis>=3.0.0rc1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
tkr-fmo-pyscf-worker = "tkr_fmo_pyscf_worker_impl.main:main"

