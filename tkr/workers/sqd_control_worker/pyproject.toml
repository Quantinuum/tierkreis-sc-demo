[project]
name = "tkr-sqd-control-worker-impl"
version = "0.1.0"
description = "SQD problem setup, differential evolution and configuration recovery"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tierkreis==3.0.0rc1",
    "tkr-sqd-control-worker",
    "tierkreis-sc-demo",
    "numpy>=2.3",
    "scipy==1.18.1",
    "pyscf>=2.13",
    "ffsim>=0.0.60",
    "qiskit-addon-sqd>=0.12",
]

[tool.uv.sources]
tkr-sqd-control-worker = { workspace = true }
tierkreis-sc-demo = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
tkr-sqd-control-worker = "tkr_sqd_control_worker_impl.main:main"
