[project]
name = "tkr-fmo-control-worker-impl"
version = "0.1.0"
description = "FMO optimization feedback and energy reduction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tierkreis",
    "tkr-fmo-control-worker",
    "tierkreis-sc-demo",
    "numpy>=2.3",
    "scipy==1.18.1",
]

[tool.uv.sources]
tkr-fmo-control-worker = { workspace = true }
tierkreis-sc-demo = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
tkr-fmo-control-worker = "tkr_fmo_control_worker_impl.main:main"
