executor = "slurm"
nodes = 1
cpu = 2
memory = "4Gi"
walltime = "01:00:00"

# Use mpirun from the MPI installation used to build diag, inside the allocation.
# Keep the explicit -n count in sync with proc;
[mpi]
proc = "2"
launcher = ["mpirun", "-n", "2"]

[extra_scheduler_args]
"--account" = "qfw-test"
"--output" = ".runtime/slurm-%j.out"

[env]
OTEL_EXPORTER_OTLP_ENDPOINT = "http://otel-collector:4317"
OMP_NUM_THREADS = "1"
OPENBLAS_NUM_THREADS = "1"
MKL_NUM_THREADS = "1"
