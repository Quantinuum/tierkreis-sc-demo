executor = "slurm"
nodes = 1
cpu = 2
memory = "4Gi"
walltime = "01:00:00"

# The batch script launches the MPI binary directly within its allocation.
# Add e.g. "--mpi=pmix" to `launcher` if the site requires it.
[mpi]
proc = "2"
launcher = ["srun"]

[extra_scheduler_args]
"--account" = "qfw-test"
"--output" = ".runtime/slurm-%j.out"

[env]
OTEL_EXPORTER_OTLP_ENDPOINT = "http://otel-collector:4317"
OMP_NUM_THREADS = "1"
OPENBLAS_NUM_THREADS = "1"
MKL_NUM_THREADS = "1"
