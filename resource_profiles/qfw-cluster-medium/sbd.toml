executor = "slurm"
nodes = 1
# Tierkreis maps cpu to Slurm --cpus-per-task, independently of MPI rank count.
cpu = 1
memory = "4Gi"
walltime = "01:00:00"

[mpi]
proc = "2"
launcher = ["mpirun", "-n", "2"]

[extra_scheduler_args]
"--account" = "qfw-test"
"--partition" = "normal"
"--nodelist" = "c1"
"--output" = ".runtime/slurm-%j.out"

[env]
OMP_NUM_THREADS = "1"
OPENBLAS_NUM_THREADS = "1"
MKL_NUM_THREADS = "1"
